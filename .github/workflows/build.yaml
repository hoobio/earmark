name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build the packages without a release-please release (use if release-please misfires)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_SDK_VERSION: "10.0.x"
  SOLUTION_PATH: Earmark.slnx
  WIX_SOURCE_PATH: installer/Earmark.wxs
  BOM_FILE: sbom.cdx.json
  AVALONIA_TELEMETRY_OPTOUT: "1"
  # Actions allows no expressions in `uses:` refs, so the hoobio/pipeline-tools pin (v2.2.1) repeats in each `uses:` line: bump in lockstep.

jobs:
  release-please:
    name: Release Please
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: hoobio/pipeline-tools/pipeline/github/step/release-please@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  lint-and-test:
    name: Lint & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build (TreatWarningsAsErrors)
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release -p:TreatWarningsAsErrors=true

      - name: Test
        shell: pwsh
        run: |
          foreach ($project in Get-ChildItem tests -Recurse -Filter *.csproj) {
            dotnet test --project $project.FullName -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  build-msix:
    name: Build MSIX (${{ matrix.platform }})
    # Only the release / pre-release / Store jobs consume the packages, so ordinary pushes to main skip the build.
    needs: [release-please]
    if: >-
      always()
      && (
        github.event_name == 'pull_request'
        || needs.release-please.outputs.release_created == 'true'
        || (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' && vars.SIGNING_CERT_THUMBPRINT != '' }}
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      release-version: ${{ steps.version.outputs.release-version }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Resolve version and identity
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $release = (Get-Content version.txt -Raw).Trim()
          $majorMinor = $release -replace '^(\d+\.\d+)\.\d+$', '$1'
          $prerelease = $env:EVENT_NAME -eq 'pull_request' -and $env:HEAD_REF -eq 'release-please--branches--main'
          "release-version=$release" | Out-File -Append $env:GITHUB_OUTPUT
          # Store never downgrades, so the run number keeps every build above any earlier flight.
          "package-version=$majorMinor.$($env:GITHUB_RUN_NUMBER).0" | Out-File -Append $env:GITHUB_OUTPUT
          "identity=$($prerelease ? 'Prerelease' : 'Store')" | Out-File -Append $env:GITHUB_OUTPUT
          "display-version=$($prerelease ? "$release-pre.$($env:GITHUB_RUN_NUMBER)" : '')" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          IDENTITY: ${{ steps.version.outputs.identity }}
          VERSION: ${{ steps.version.outputs.package-version }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display-version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = ./scripts/Build-DesktopMsix.ps1 -Platform $env:PLATFORM -Identity $env:IDENTITY -Version $env:VERSION `
            -DisplayVersion $env:DISPLAY_VERSION -UnsignedTest:($env:EVENT_NAME -eq 'pull_request') `
            -OutputDirectory "$env:RUNNER_TEMP\msix-$env:PLATFORM" | Select-Object -Last 1
          $package | Format-List | Out-String | Write-Host
          New-Item -ItemType Directory -Path "staging\msix-$env:PLATFORM" -Force | Out-Null
          Copy-Item $package.Msix "staging\msix-$env:PLATFORM"
          if ($package.MsixUnsignedTest) {
            New-Item -ItemType Directory -Path "staging\msix-unsigned-$env:PLATFORM" -Force | Out-Null
            Copy-Item $package.MsixUnsignedTest "staging\msix-unsigned-$env:PLATFORM"
          }

      - name: Sign MSIX
        if: env.HAS_SIGNING_CERT == 'true'
        uses: hoobio/pipeline-tools/pipeline/github/step/sign-msix@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          pfx-base64: ${{ secrets.SIGNING_CERTIFICATE }}
          pfx-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          thumbprint: ${{ vars.SIGNING_CERT_THUMBPRINT }}
          packages-path: ${{ github.workspace }}\staging\msix-${{ matrix.platform }}

      - name: Skip-sign notice
        if: env.HAS_SIGNING_CERT != 'true'
        shell: bash
        run: echo "::warning::SIGNING_CERTIFICATE / SIGNING_CERT_THUMBPRINT not set; MSIX produced unsigned."

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ github.workspace }}\staging\msix-${{ matrix.platform }}\Earmark-${{ steps.version.outputs.release-version }}-${{ matrix.platform }}.msix
          if-no-files-found: error

      - name: Upload unsigned-namespace test MSIX artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msix-${{ matrix.platform }}-unsigned
          path: ${{ github.workspace }}\staging\msix-unsigned-${{ matrix.platform }}\Earmark-${{ steps.version.outputs.release-version }}-${{ matrix.platform }}-unsigned.msix
          if-no-files-found: error

  msix-bundle:
    name: Bundle MSIX for the Store
    needs: [build-msix]
    if: always() && needs.build-msix.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Download MSIX (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-x64
          path: bundle-input

      - name: Download MSIX (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-ARM64
          path: bundle-input

      - name: Build msixupload
        shell: pwsh
        env:
          VERSION: ${{ needs.build-msix.outputs.package-version }}
        run: |
          New-Item -ItemType Directory -Path staging\msixupload -Force | Out-Null
          ./scripts/New-MsixBundle.ps1 -MsixDirectory bundle-input -Version $env:VERSION -OutputDirectory staging\msixupload | Format-List

      - name: Upload msixupload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msixupload
          path: ${{ github.workspace }}\staging\msixupload\Earmark-${{ needs.build-msix.outputs.package-version }}-Store.msixupload
          if-no-files-found: error

  build-msi:
    name: Build MSI (${{ matrix.platform }})
    needs: [release-please]
    if: >-
      always()
      && (
        github.event_name == 'pull_request'
        || needs.release-please.outputs.release_created == 'true'
        || (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' && vars.SIGNING_CERT_THUMBPRINT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          "version=$ver" | Out-File -Append $env:GITHUB_OUTPUT
          "APP_VERSION=$ver" | Out-File -Append $env:GITHUB_ENV

      - name: Publish unpackaged self-contained build
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          PUBLISH_DIR: ${{ github.workspace }}\publish\${{ matrix.platform }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $channel = if ($env:EVENT_NAME -eq 'pull_request' -and $env:HEAD_REF -eq 'release-please--branches--main') { 'Prerelease' } else { 'Release' }
          # The WiX build reads $(env.EARMARK_CHANNEL) for the per-channel ARP name, install folder and UpgradeCode.
          "EARMARK_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $display = if ($channel -eq 'Prerelease') { "$($env:APP_VERSION)-pre.$($env:GITHUB_RUN_NUMBER)" }
          ./scripts/Publish-EarmarkDesktop.ps1 -Platform $env:PLATFORM -Channel $channel -DisplayVersion $display -OutputDirectory $env:PUBLISH_DIR

      - name: Build MSI
        uses: hoobio/pipeline-tools/pipeline/github/step/build-msi-wix@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          wix-source-path: ${{ env.WIX_SOURCE_PATH }}
          version: ${{ steps.version.outputs.version }}
          platform: ${{ matrix.platform }}
          payload-dir: ${{ github.workspace }}\publish\${{ matrix.platform }}
          output-dir: ${{ github.workspace }}\staging\msi-${{ matrix.platform }}
          # Unversioned pulls 7.0.0, which fails: "Could not find expected package root folder wixext5".
          extensions: "WixToolset.UI.wixext/5.0.2,WixToolset.Util.wixext/5.0.2"

      - name: Sign MSI
        if: env.HAS_SIGNING_CERT == 'true'
        uses: hoobio/pipeline-tools/pipeline/github/step/sign-msi@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          pfx-base64: ${{ secrets.SIGNING_CERTIFICATE }}
          pfx-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          thumbprint: ${{ vars.SIGNING_CERT_THUMBPRINT }}
          packages-path: ${{ github.workspace }}\staging\msi-${{ matrix.platform }}

      - name: Skip-sign notice
        if: env.HAS_SIGNING_CERT != 'true'
        shell: bash
        run: echo "::warning::SIGNING_CERTIFICATE / SIGNING_CERT_THUMBPRINT not set; MSI produced unsigned."

      - name: Upload MSI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msi-${{ matrix.platform }}
          path: ${{ github.workspace }}\staging\msi-${{ matrix.platform }}\Earmark-${{ steps.version.outputs.version }}-${{ matrix.platform }}.msi
          if-no-files-found: error

  build-portable:
    name: Build portable exe (${{ matrix.platform }})
    needs: [release-please]
    if: >-
      always()
      && (
        github.event_name == 'pull_request'
        || needs.release-please.outputs.release_created == 'true'
        || (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' && vars.SIGNING_CERT_THUMBPRINT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          "version=$ver" | Out-File -Append $env:GITHUB_OUTPUT
          "APP_VERSION=$ver" | Out-File -Append $env:GITHUB_ENV

      - name: Publish single-file exe
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          PUBLISH_DIR: ${{ github.workspace }}\publish
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $channel = if ($env:EVENT_NAME -eq 'pull_request' -and $env:HEAD_REF -eq 'release-please--branches--main') { 'Prerelease' } else { 'Release' }
          $display = if ($channel -eq 'Prerelease') { "$($env:APP_VERSION)-pre.$($env:GITHUB_RUN_NUMBER)" }
          ./scripts/Publish-EarmarkDesktop.ps1 -Platform $env:PLATFORM -Channel $channel -DisplayVersion $display -OutputDirectory $env:PUBLISH_DIR -SingleFile
          $stray = Get-ChildItem $env:PUBLISH_DIR -File -Filter *.dll
          if ($stray) { throw "Native libraries left beside the exe: $($stray.Name -join ', ')" }
          New-Item -ItemType Directory -Path staging\licences -Force | Out-Null
          Copy-Item (Join-Path $env:PUBLISH_DIR 'Earmark.exe') staging\Earmark.exe
          Copy-Item LICENSE staging\licences\Earmark-LICENSE.txt
          # OFL and MIT font licences must ship with each copy.
          Get-ChildItem -Path (Join-Path $env:PUBLISH_DIR 'Assets\Fonts\*.txt'), 'src\Earmark.Desktop\Assets\Fonts\*.txt' -ErrorAction SilentlyContinue |
            Copy-Item -Destination staging\licences -Force

      - name: Sign exe
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERTIFICATE }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          THUMBPRINT: ${{ vars.SIGNING_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N') + '.pfx')
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $secure = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object { [version]($_.FullName -replace '.*\\(\d+\.\d+\.\d+\.\d+)\\.*', '$1') } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'Could not locate signtool.exe under the Windows SDK' }
          & $signtool sign /fd SHA256 /sha1 $env:THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 staging\Earmark.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for staging\Earmark.exe (exit $LASTEXITCODE)" }

      - name: Skip-sign notice
        if: env.HAS_SIGNING_CERT != 'true'
        shell: bash
        run: echo "::warning::SIGNING_CERTIFICATE / SIGNING_CERT_THUMBPRINT not set; exe produced unsigned."

      - name: Zip the exe and licences
        shell: pwsh
        env:
          ZIP_NAME: Earmark-${{ steps.version.outputs.version }}-win-${{ matrix.platform == 'ARM64' && 'arm64' || 'x64' }}.zip
        run: |
          New-Item -ItemType Directory -Path staging\zip -Force | Out-Null
          Compress-Archive -Path staging\Earmark.exe, staging\licences -DestinationPath "staging\zip\$env:ZIP_NAME"

      - name: Upload portable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-${{ matrix.platform }}
          path: ${{ github.workspace }}\staging\zip\Earmark-${{ steps.version.outputs.version }}-win-${{ matrix.platform == 'ARM64' && 'arm64' || 'x64' }}.zip
          if-no-files-found: error

  wack:
    name: WACK (${{ matrix.platform }})
    needs: [build-msix]
    # build-msix runs under `always()`, so the skipped release-please job would skip WACK too without this.
    if: always() && needs.build-msix.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/wack-exclusions.json
          sparse-checkout-cone-mode: false

      - name: Download MSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-${{ matrix.platform }}
          path: msix

      - name: Run WACK
        uses: hoobio/pipeline-tools/pipeline/github/step/run-wack@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          msix-path: msix
          report-path: wack-report-${{ matrix.platform }}.xml
          exclusions-path: .github/wack-exclusions.json
          platform: ${{ matrix.platform }}
          fail-on-error: 'true'

      - name: Upload WACK report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wack-report-${{ matrix.platform }}
          path: wack-report-${{ matrix.platform }}.xml
          if-no-files-found: warn

  sbom:
    name: SBOM
    runs-on: windows-latest
    env:
      DT_HOST: ${{ secrets.DT_HOST }}
      DT_API_KEY: ${{ secrets.DT_API_KEY }}
      DT_DOMAIN: audio
      DT_SYSTEM: earmark
      DT_COMPONENT: earmark-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Resolve DT channel
        id: dt
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: main
        run: |
          if ($env:EVENT_NAME -eq 'release') {
            $channel = 'release'
            $subChannel = ''
            $projectVersion = $env:REF_NAME
            $markLatest = 'true'
            $prune = 'false'
          }
          else {
            $branchSource = if ($env:EVENT_NAME -eq 'pull_request') { $env:HEAD_REF } else { $env:REF_NAME }
            $sanitized = ($branchSource -replace '[^A-Za-z0-9._/-]', '-')
            if ($sanitized -eq $env:DEFAULT_BRANCH) {
              $channel = $sanitized
              $subChannel = ''
            }
            else {
              $channel = 'ci'
              $subChannel = $sanitized
            }
            $projectVersion = $env:SHA
            $markLatest = 'false'
            $prune = 'true'
          }

          $effectiveChannel = if ($subChannel) { $subChannel } else { $channel }

          "channel=$channel"                  | Out-File -Append $env:GITHUB_OUTPUT
          "sub_channel=$subChannel"           | Out-File -Append $env:GITHUB_OUTPUT
          "effective_channel=$effectiveChannel" | Out-File -Append $env:GITHUB_OUTPUT
          "project_version=$projectVersion"   | Out-File -Append $env:GITHUB_OUTPUT
          "mark_latest=$markLatest"           | Out-File -Append $env:GITHUB_OUTPUT
          "prune=$prune"                      | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "Channel:           $channel"
          Write-Host "SubChannel:        $subChannel"
          Write-Host "EffectiveChannel:  $effectiveChannel"
          Write-Host "ProjectVersion:    $projectVersion"
          Write-Host "MarkLatest:        $markLatest"
          Write-Host "Prune:             $prune"

      - name: Generate CycloneDX SBOM
        uses: hoobio/pipeline-tools/pipeline/github/step/cyclonedx-sbom-dotnet@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          solution-path: ${{ env.SOLUTION_PATH }}
          output-path: ${{ env.BOM_FILE }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: ${{ env.BOM_FILE }}
          if-no-files-found: error

      - name: Upload SBOM to Dependency-Track
        if: env.DT_HOST != '' && env.DT_API_KEY != ''
        uses: hoobio/pipeline-tools/pipeline/github/job/upload-sbom-to-dependency-track@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          bom-path: ${{ env.BOM_FILE }}
          upload-artifact: 'false'
          server-url: https://${{ env.DT_HOST }}
          api-key: ${{ env.DT_API_KEY }}
          domain: ${{ env.DT_DOMAIN }}
          system: ${{ env.DT_SYSTEM }}
          component: ${{ env.DT_COMPONENT }}
          channel: ${{ steps.dt.outputs.channel }}
          sub-channel: ${{ steps.dt.outputs.sub_channel }}
          default-branch: main
          project-version: ${{ steps.dt.outputs.project_version }}
          project-tags: channel=${{ steps.dt.outputs.effective_channel }},repo=${{ github.repository }},commit=${{ github.sha }},run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mark-latest: ${{ steps.dt.outputs.mark_latest }}
          prune-stale-children: ${{ steps.dt.outputs.prune }}
          keep: ${{ github.event_name == 'workflow_dispatch' && '1' || '10' }}

      - name: Skip notice if Dependency-Track secrets not configured
        if: env.DT_HOST == '' || env.DT_API_KEY == ''
        shell: bash
        run: echo "::warning::DT_HOST or DT_API_KEY secret not set; skipping Dependency-Track upload."

  release:
    name: Publish Release
    needs: [release-please, lint-and-test, build-msix, msix-bundle, build-msi, build-portable, wack, sbom]
    if: >-
      always()
      && needs.release-please.outputs.release_created == 'true'
      && needs.lint-and-test.result == 'success'
      && needs.build-msix.result == 'success'
      && needs.msix-bundle.result == 'success'
      && needs.build-msi.result == 'success'
      && needs.build-portable.result == 'success'
      && needs.wack.result == 'success'
      && needs.sbom.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download MSIX (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-x64
          path: release/msix-x64
      - name: Download MSIX (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-ARM64
          path: release/msix-ARM64
      - name: Download msixupload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msixupload
          path: release/msixupload
      - name: Download MSI (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msi-x64
          path: release/msi-x64
      - name: Download MSI (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msi-ARM64
          path: release/msi-ARM64
      - name: Download portable zip (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portable-x64
          path: release/portable-x64
      - name: Download portable zip (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portable-ARM64
          path: release/portable-ARM64
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom
          path: release/sbom
      - name: Download WACK report (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wack-report-x64
          path: release/wack-x64
      - name: Download WACK report (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wack-report-ARM64
          path: release/wack-ARM64

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "release/msix-*/*.msix,release/msixupload/*.msixupload,release/msi-*/*.msi,release/portable-*/*.zip"

      - name: Attach all artefacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t RELEASE_FILES < <(find release -type f \( \
            -name '*.msix' -o \
            -name '*.msixupload' -o \
            -name '*.msi'  -o \
            -name '*.zip'  -o \
            -name '*.cdx.json' -o \
            -name 'wack-report-*.xml' \))
          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "::error::No release files found to attach"
            exit 1
          fi
          printf 'Attaching: %s\n' "${RELEASE_FILES[@]}"
          gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber --repo "${{ github.repository }}"

      - name: Publish draft release
        uses: hoobio/pipeline-tools/pipeline/github/step/publish-github-release@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          github-token: ${{ github.token }}

  pre-release:
    name: Pre-Release
    # Shipped clients ignore these: the in-app update check only considers pre-releases on the Prerelease channel.
    needs: [build-msix, build-msi, build-portable, lint-and-test]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.head_ref == 'release-please--branches--main'
      && needs.build-msix.result == 'success'
      && needs.build-msi.result == 'success'
      && needs.build-portable.result == 'success'
      && needs.lint-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: version
        run: |
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/release_notes.txt
          else
            git log --pretty=format:"- %s" --no-merges -20 > /tmp/release_notes.txt
          fi

      - name: Download MSIX (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-x64
          path: release/msix-x64
      - name: Download MSIX (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-ARM64
          path: release/msix-ARM64
      # Pre-release only: `Add-AppxPackage -AllowUnsigned` installs these without trusting a cert.
      - name: Download unsigned test MSIX (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-x64-unsigned
          path: release/msix-x64-unsigned
      - name: Download unsigned test MSIX (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-ARM64-unsigned
          path: release/msix-ARM64-unsigned
      - name: Download MSI (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msi-x64
          path: release/msi-x64
      - name: Download MSI (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msi-ARM64
          path: release/msi-ARM64
      - name: Download portable zip (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portable-x64
          path: release/portable-x64
      - name: Download portable zip (ARM64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portable-ARM64
          path: release/portable-ARM64

      # Created as a draft first so the asset upload completes on repos with immutable releases.
      - name: Create pre-release (draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}-pre.${{ github.run_number }}
          name: v${{ steps.version.outputs.version }}-pre.${{ github.run_number }}
          prerelease: true
          draft: true
          make_latest: false
          body_path: /tmp/release_notes.txt
          files: |
            release/**/*.msix
            release/**/*.msi
            release/**/*.zip

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}-pre.${{ github.run_number }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease

      - name: Prune old pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 3
        run: |
          VERSION_PREFIX="v${{ steps.version.outputs.version }}-pre."
          RELEASES=$(gh release list \
            --repo ${{ github.repository }} \
            --limit 100 \
            --json tagName,isPrerelease \
            --jq "[.[] | select(.isPrerelease == true and (.tagName | startswith(\"$VERSION_PREFIX\")))] | sort_by(.tagName) | reverse | .[${KEEP}:] | .[].tagName")
          for TAG in $RELEASES; do
            echo "Deleting old pre-release: $TAG"
            gh release delete "$TAG" --repo ${{ github.repository }} --yes --cleanup-tag
          done

  store-submit:
    name: Publish to Microsoft Store
    needs: [release-please, lint-and-test, build-msix, msix-bundle]
    if: >-
      always()
      && needs.release-please.outputs.release_created == 'true'
      && needs.lint-and-test.result == 'success'
      && needs.msix-bundle.result == 'success'
      && vars.AZURE_CLIENT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      STORE_PRODUCT_ID: 9N27KG5M9W9B
      KEY_VAULT: hbicfgkvtaus01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download msixupload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msixupload
          path: package

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Find previous published release
        id: previous-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-msix.outputs.release-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api repos/${{ github.repository }}/releases --paginate | ConvertFrom-Json
          $current = [version]$env:VERSION
          $best = $null
          foreach ($r in $releases) {
            if ($r.draft -or $r.prerelease) { continue }
            if ($r.tag_name -notmatch '^v?(\d+\.\d+\.\d+)$') { continue }
            $v = [version]$Matches[1]
            if ($v -ge $current) { continue }
            if (-not $best -or $v -gt $best) { $best = $v }
          }
          if ($best) { "since=$best" | Out-File -Append $env:GITHUB_OUTPUT }

      - name: Configure Store credentials from Key Vault
        shell: pwsh
        run: |
          $store = @{}
          foreach ($name in 'tenant-id', 'client-id', 'client-secret', 'seller-id') {
            $value = az keyvault secret show --vault-name $env:KEY_VAULT --name "msstore-$name" --query value -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $value) { throw "Key Vault secret msstore-$name could not be read" }
            Write-Host "::add-mask::$value"
            $store[$name] = $value
          }
          msstore reconfigure --tenantId $store['tenant-id'] --sellerId $store['seller-id'] --clientId $store['client-id'] --clientSecret $store['client-secret']
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }

      - name: Publish package + release notes to Store
        shell: pwsh
        env:
          PRODUCT_ID: ${{ env.STORE_PRODUCT_ID }}
          VERSION: ${{ needs.build-msix.outputs.release-version }}
          SINCE_VERSION: ${{ steps.previous-release.outputs.since }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\scripts\Get-StoreWhatsNew.ps1"
          . "$env:GITHUB_WORKSPACE\scripts\Wait-StoreSubmissionClear.ps1"
          $package = (Get-ChildItem package -Filter *.msixupload | Select-Object -First 1).FullName
          if (-not $package) { throw 'No .msixupload artifact found' }

          $attempt = 0
          do {
            $attempt++
            Wait-StoreSubmissionClear -ProductId $env:PRODUCT_ID
            $publishOut = msstore publish $package -id $env:PRODUCT_ID --noCommit 2>&1 | Out-String
            Write-Host $publishOut
            if ($LASTEXITCODE -eq 0) { break }
            if ($publishOut -notmatch 'Error while creating submission' -or $attempt -ge 3) {
              throw "msstore publish failed ($LASTEXITCODE)"
            }
            Write-Host "msstore publish failed creating the submission; retrying in 60 seconds (attempt $attempt of 3)."
            Start-Sleep -Seconds 60
          } while ($true)

          $whatsNewParams = @{ ChangelogPath = "$env:GITHUB_WORKSPACE\CHANGELOG.md"; Version = $env:VERSION }
          if ($env:SINCE_VERSION) { $whatsNewParams.SinceVersion = $env:SINCE_VERSION }
          $whatsNew = Get-StoreWhatsNew @whatsNewParams

          $sub = Get-StorePendingSubmission -ProductId $env:PRODUCT_ID -PackagePath $package
          Hide-StoreUploadUrl $sub

          foreach ($listing in $sub.Listings.PSObject.Properties) {
            $listing.Value.BaseListing | Add-Member -NotePropertyName ReleaseNotes -NotePropertyValue $whatsNew -Force
          }
          $delivery = $sub.PackageDeliveryOptions ?? [pscustomobject]@{}
          $delivery | Add-Member IsMandatoryUpdate $true -Force
          $delivery | Add-Member MandatoryUpdateEffectiveDate ([DateTime]::UtcNow.ToString('o')) -Force
          $sub | Add-Member PackageDeliveryOptions $delivery -Force

          # submission update, not updateMetadata: updateMetadata drops PackageDeliveryOptions.
          $sub | ConvertTo-Json -Depth 100 | Set-Content -Path patched.json -Encoding utf8
          $null = msstore submission update $env:PRODUCT_ID (Get-Content -Raw patched.json) 2>&1
          if ($LASTEXITCODE -ne 0) { throw "submission update failed ($LASTEXITCODE)" }

          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "submission publish failed ($LASTEXITCODE)" }
          Write-Host "Submitted $package to the Store (product $env:PRODUCT_ID)."

  store-flight:
    name: Submit to Store pre-release flight
    needs: [release-please, lint-and-test, build-msix, msix-bundle]
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && needs.lint-and-test.result == 'success'
      && needs.msix-bundle.result == 'success'
      && vars.STORE_FLIGHT_ID != ''
      && vars.AZURE_CLIENT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      STORE_PRODUCT_ID: 9N27KG5M9W9B
      KEY_VAULT: hbicfgkvtaus01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download msixupload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msixupload
          path: package

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure Store credentials from Key Vault
        shell: pwsh
        run: |
          $store = @{}
          foreach ($name in 'tenant-id', 'client-id', 'client-secret', 'seller-id') {
            $value = az keyvault secret show --vault-name $env:KEY_VAULT --name "msstore-$name" --query value -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $value) { throw "Key Vault secret msstore-$name could not be read" }
            Write-Host "::add-mask::$value"
            $store[$name] = $value
          }
          msstore reconfigure --tenantId $store['tenant-id'] --sellerId $store['seller-id'] --clientId $store['client-id'] --clientSecret $store['client-secret']
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }

      - name: Publish package to the Store flight
        shell: pwsh
        env:
          PRODUCT_ID: ${{ env.STORE_PRODUCT_ID }}
          FLIGHT_ID: ${{ vars.STORE_FLIGHT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\scripts\Wait-StoreSubmissionClear.ps1"
          $package = (Get-ChildItem package -Filter *.msixupload | Select-Object -First 1).FullName
          if (-not $package) { throw 'No .msixupload artifact found' }

          $attempt = 0
          do {
            $attempt++
            Wait-StoreSubmissionClear -ProductId $env:PRODUCT_ID -FlightId $env:FLIGHT_ID
            $publishOut = msstore publish $package -id $env:PRODUCT_ID --flightId $env:FLIGHT_ID --noCommit 2>&1 | Out-String
            Write-Host $publishOut
            if ($LASTEXITCODE -eq 0) { break }
            if ($publishOut -notmatch 'Error while creating flight submission' -or $attempt -ge 3) {
              throw "msstore publish failed ($LASTEXITCODE)"
            }
            Write-Host "msstore publish failed creating the flight submission; retrying in 60 seconds (attempt $attempt of 3)."
            Start-Sleep -Seconds 60
          } while ($true)

          $sub = Get-StorePendingSubmission -ProductId $env:PRODUCT_ID -PackagePath $package -FlightId $env:FLIGHT_ID
          Hide-StoreUploadUrl $sub
          $delivery = $sub.PackageDeliveryOptions ?? [pscustomobject]@{}
          $delivery | Add-Member IsMandatoryUpdate $true -Force
          $delivery | Add-Member MandatoryUpdateEffectiveDate ([DateTime]::UtcNow.ToString('o')) -Force
          $sub | Add-Member PackageDeliveryOptions $delivery -Force
          $sub | ConvertTo-Json -Depth 100 | Set-Content -Path patched.json -Encoding utf8
          $null = msstore flights submission update $env:PRODUCT_ID $env:FLIGHT_ID (Get-Content -Raw patched.json) 2>&1
          if ($LASTEXITCODE -ne 0) { throw "flights submission update failed ($LASTEXITCODE)" }

          msstore flights submission publish $env:PRODUCT_ID $env:FLIGHT_ID
          if ($LASTEXITCODE -ne 0) { throw "flights submission publish failed ($LASTEXITCODE)" }
          Write-Host "Submitted $package to Store flight $env:FLIGHT_ID (product $env:PRODUCT_ID)."
